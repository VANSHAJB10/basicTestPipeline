pipeline:
  name: Lab13GitExConnector
  identifier: Lab13GitExConnector
  projectIdentifier: Labs
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: gitexp-task1-connector
        identifier: gitexptask1connector
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: ShellScript
                  identifier: ShellScript
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "this is task AutoCreate of lab 13"
                          echo "keep it up! ${Executor}"
                    environmentVariables:
                      - name: Executor
                        type: String
                        value: Vanshaj
                    outputVariables: []
                  timeout: 10m
              - step:
                  type: Wait
                  name: Wait5seconds
                  identifier: Wait5seconds
                  spec:
                    duration: 10m
              - step:
                  type: ShellScript
                  name: donePrint
                  identifier: donePrint
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: echo "Done and Dusted"
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m

    - stage:
        name: deployK8s
        identifier: deployK8s
        description: ""
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: Lab13GitExpAutoCreate
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: <+input>
                      sources: <+input>
          environment:
            environmentRef: K8Env
            deployToAll: false
            infrastructureDefinitions:
              - identifier: lab2infra
          execution:
            steps:
              - step:
                  name: Rollout Deployment
                  identifier: rolloutDeployment
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: StageRollback
            rollbackSteps:
              - step:
                  name: Rollback Rollout Deployment
                  identifier: rollbackRolloutDeployment
                  type: K8sRollingRollback
                  timeout: 10m
                  spec:
                    pruningEnabled: false
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback

  variables:
    - name: env
      type: String
      description: ""
      required: false
      value: <+input>
